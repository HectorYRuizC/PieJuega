spring.application.name=PieJuega

# Activar perfil
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# SERVER
# ===============================
server.port=8080

# URL base pública de la app (se usa en enlaces enviados por correo)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# JPA / HIBERNATE
# (ddl-auto y show-sql viven en cada perfil: ver application-dev.properties)
# ===============================

# ===============================
# FIREBASE CLOUD MESSAGING
# ===============================
firebase.project-id=${FIREBASE_PROJECT_ID:piejuega-5c819}
firebase.messaging.enabled=${FIREBASE_MESSAGING_ENABLED:true}

# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# MEDIA UPLOADS
# ===============================
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB













